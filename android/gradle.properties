# Memory for the Gradle daemon (the Java process that builds the Android app).
#
# The Flutter template sets -Xmx8G with a 4G metaspace. A PC with 8 GB of RAM
# cannot give that much, so the Java process dies at once. Gradle then reports
# "Unable to establish loopback connection", which hides the real cause.
#
# 1536 MB of heap is enough for this project. Raise it only if a build fails
# with an OutOfMemoryError.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
